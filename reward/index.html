<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ma propriété — récompenses</title>
<link rel="icon" href="assets/coin.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Shantell+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- The property fills the screen; everything else floats above it. -->
<div id="viewport" class="viewport">
  <div id="world" class="world"></div>
</div>

<div class="hud">
  <!-- Everything to press lives along the top: the purse and the shop on
       the left, the way out on the right. The bottom of the screen is
       left to the object in hand and to the bar of what is selected. -->
  <div class="hud-top-left">
    <button id="purse" class="purse" title="Ajouter des pièces (prototype)">
      <img src="assets/coin.svg" alt="pièces">
      <span id="coins">0</span>
    </button>
    <button class="round-btn" data-panel="shop" title="Magasin" aria-label="Magasin">
      <img class="btn-icon" src="assets/cart.svg" alt="">
    </button>
    <button id="share" class="round-btn" title="Partager mon monde" aria-label="Partager mon monde">
      <img class="btn-icon" src="assets/share.svg" alt="">
    </button>
  </div>

  <!-- One button per floor, under the way out, when a building has
       more than one floor. -->
  <div id="floors" class="floors" hidden></div>

  <div class="hud-top-right">
    <button id="back" class="round-btn" title="Retour aux exercices" aria-label="Retour aux exercices">
      <img class="btn-icon" src="assets/back.svg" alt="">
    </button>
    <button id="exit" class="round-btn" title="Sortir" aria-label="Sortir" hidden>
      <img class="btn-icon" src="assets/exit.svg" alt="">
    </button>
  </div>

  <!-- What the child is carrying, waiting for a free tile. -->
  <div id="hand" class="hand" hidden>
    <img id="hand-art" src="" alt="">
    <div class="hand-text">
      <b id="hand-name"></b>
      <span id="hand-sub" class="hand-sub"></span>
      <span class="hand-price"><img src="assets/coin.svg" alt="pièces"><span id="hand-price"></span></span>
      <span class="hand-hint">Touche une case pour poser</span>
      <span id="hand-colours" class="swatches hand-swatches"></span>
    </div>
    <div class="hand-poses">
      <button id="turn-held" class="hand-pose" aria-label="Tourner l'objet" title="Tourner">↻</button>
      <button id="mirror-held" class="hand-pose" aria-label="Retourner l'objet" title="Miroir">⇄</button>
    </div>
    <button id="cancel-placing" class="hand-cancel" aria-label="Reposer l'objet">✕</button>
  </div>

  <div class="top-stack">
    <div id="visiting" class="visiting" hidden>
      <span id="visiting-what"></span>
      <button id="go-home" class="visiting-btn">Revenir chez moi</button>
    </div>
    <div id="scene-name" class="scene-pill"></div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <div id="action-bar" class="action-bar" hidden></div>
</div>

<!-- The shop takes the whole screen: its list scrolls without fighting
     any other gesture, and the categories stay in sight. -->
<section id="panel-shop" class="screen" hidden aria-label="Magasin">
  <header class="screen-head">
    <h2>Magasin</h2>
    <div class="screen-purse">
      <img src="assets/coin.svg" alt="pièces">
      <span id="shop-coins">0</span>
    </div>
    <button class="close-btn" data-close aria-label="Fermer">✕</button>
  </header>
  <p class="screen-hint">Touche un objet pour le prendre en main</p>
  <p id="shop-level" class="screen-level"></p>
  <div id="shop-tabs" class="chips"></div>
  <div id="shop-grid" class="grid"></div>
</section>

<script src="js/catalog.js"></script>
<script src="js/share.js"></script>
<script src="js/scenes.js"></script>
<script src="js/ground.js"></script>
<script src="js/state.js"></script>
<script src="js/world.js"></script>
<script src="js/shop.js"></script>
<script src="js/app.js"></script>
</body>
</html>
