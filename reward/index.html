<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ma propriété — récompenses</title>
<link rel="icon" href="assets/coin.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Shantell+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- The property fills the screen; everything else floats above it. -->
<div id="viewport" class="viewport">
  <div id="world" class="world"></div>
</div>

<div class="hud">
  <div class="hud-top-left">
    <button id="back" class="round-btn" title="Retour aux exercices" aria-label="Retour aux exercices">←</button>
    <button id="dev-toggle" class="round-btn small" title="Panneau parent" aria-label="Panneau parent">⚙</button>
  </div>

  <button id="purse" class="purse" title="Ajouter des pièces (prototype)">
    <img src="assets/coin.svg" alt="pièces">
    <span id="coins">0</span>
  </button>

  <div class="hud-bottom">
    <button class="big-btn" data-panel="shop"><span aria-hidden="true">🛒</span> Magasin</button>
    <button class="big-btn" data-panel="chest">
      <span aria-hidden="true">🧰</span> Coffre
      <span id="chest-badge" class="badge" hidden>0</span>
    </button>
  </div>

  <!-- Messages stack under the top row, clear of the sheets below. -->
  <div class="top-stack">
    <div id="placing-bar" class="placing" hidden>
      <span id="placing-name"></span>
      <button id="cancel-placing">Annuler</button>
    </div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <div id="action-bar" class="action-bar" hidden></div>
</div>

<section id="panel-shop" class="sheet" hidden aria-label="Magasin">
  <header class="sheet-head">
    <h2>Magasin</h2>
    <button class="close-btn" data-close aria-label="Fermer">✕</button>
  </header>
  <div id="shop-tabs" class="chips"></div>
  <div id="shop-grid" class="grid"></div>
</section>

<section id="panel-chest" class="sheet sheet-short" hidden aria-label="Coffre">
  <header class="sheet-head">
    <h2>Coffre</h2>
    <p class="sheet-hint">Glisse un objet sur ton terrain</p>
    <button class="close-btn" data-close aria-label="Fermer">✕</button>
  </header>
  <div id="chest-grid" class="grid chest-grid"></div>
</section>

<section id="dev-panel" class="dev" hidden>
  <p>Panneau parent — remplace l'application d'apprentissage le temps du prototype.</p>
  <div class="dev-row">
    <button id="dev-tier">Palier atteint</button>
    <button id="dev-reset" class="danger">Réinitialiser</button>
  </div>
</section>

<script src="js/catalog.js"></script>
<script src="js/state.js"></script>
<script src="js/world.js"></script>
<script src="js/shop.js"></script>
<script src="js/app.js"></script>
</body>
</html>
