<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- One square of clipped hedge. Where the hedge stops, a trimmed
       side is drawn apart; two squares side by side make one hedge -->
  <rect width="16" height="16" fill="#2f7a2c"/>
  <g fill="#3f9a37"><circle cx="4" cy="5" r="3"/><circle cx="11" cy="4" r="3.4"/><circle cx="12" cy="11" r="3"/><circle cx="5" cy="12" r="3.4"/></g>
  <g fill="#57b34a"><circle cx="8" cy="8" r="2.4"/><circle cx="3" cy="9" r="1.4"/><circle cx="13" cy="7" r="1.2"/></g>
</svg>
