<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anglais — révisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Shantell+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens: a French school exercise book (papier Seyès) ---- */
  :root {
    --paper: #FBFAF6;
    --grid-fine: rgba(122, 142, 196, 0.28);
    --grid-strong: rgba(96, 118, 180, 0.42);
    --margin-red: #D8443F;
    --ink: #1C2B63;
    --ink-soft: #5B6890;
    --card: #FFFFFF;
    --card-edge: rgba(28, 43, 99, 0.16);
    --right: #1F7A4D;
    --right-bg: rgba(31, 122, 77, 0.10);
    --wrong: #C0392B;
    --wrong-bg: rgba(192, 57, 43, 0.09);
    --focus: #1C2B63;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101725;
      --grid-fine: rgba(140, 165, 220, 0.13);
      --grid-strong: rgba(150, 175, 230, 0.20);
      --margin-red: #E86F63;
      --ink: #EAEFFA;
      --ink-soft: #9DA9C6;
      --card: #18202F;
      --card-edge: rgba(190, 205, 240, 0.20);
      --right: #5FD39B;
      --right-bg: rgba(95, 211, 155, 0.14);
      --wrong: #FF8A7A;
      --wrong-bg: rgba(255, 138, 122, 0.13);
      --focus: #EAEFFA;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101725;
    --grid-fine: rgba(140, 165, 220, 0.13);
    --grid-strong: rgba(150, 175, 230, 0.20);
    --margin-red: #E86F63;
    --ink: #EAEFFA;
    --ink-soft: #9DA9C6;
    --card: #18202F;
    --card-edge: rgba(190, 205, 240, 0.20);
    --right: #5FD39B;
    --right-bg: rgba(95, 211, 155, 0.14);
    --wrong: #FF8A7A;
    --wrong-bg: rgba(255, 138, 122, 0.13);
    --focus: #EAEFFA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(to right, var(--grid-fine) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(to bottom, var(--grid-fine) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(to bottom, var(--grid-strong) 0 1px, transparent 1px 96px);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 26px 16px 56px;
    display: flex;
    justify-content: center;
  }

  .sheet { width: 100%; max-width: 560px; }

  h1 {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-weight: 700;
    font-size: 2rem;
    color: var(--margin-red);
    margin: 0 0 20px;
    display: inline-block;
    border-bottom: 2px solid var(--margin-red);
    padding-bottom: 2px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-left: 5px solid var(--margin-red);
    border-radius: 6px;
    padding: 24px 20px;
  }

  .label { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 10px; }
  .label + .label, .stack + .label { margin-top: 24px; }

  .stack { display: grid; gap: 10px; }

  /* ---- Buttons ---- */
  button { font: inherit; cursor: pointer; }

  .choice {
    display: block;
    width: 100%;
    text-align: left;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--card-edge);
    border-radius: 5px;
    padding: 13px 15px;
  }
  .choice:hover { border-color: var(--ink); }
  .choice:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .choice .sub { display: block; color: var(--ink-soft); font-size: 0.85rem; }
  .choice[aria-pressed="true"] { border-color: var(--ink); background: var(--right-bg); }

  .bar { display: block; height: 6px; border-radius: 3px; background: var(--card-edge); margin-top: 10px; }
  .bar span { display: block; height: 100%; border-radius: 3px; background: var(--right); }
  .done { display: block; color: var(--ink-soft); font-size: 0.85rem; margin-top: 6px; }

  /* ---- Daily goal and stamps ---- */
  .goal { border-left-color: var(--ink); }
  .goal .count { font-family: "Shantell Sans", "Comic Sans MS", cursive; font-size: 1.7rem; margin: 0; }
  .goal .bar { height: 8px; margin-top: 12px; }
  .goal .row { display: flex; align-items: center; gap: 16px; }
  .goal .row .col { flex: 1; }

  .stamp { color: var(--margin-red); flex: none; }

  .rank { border-left-color: var(--margin-red); }
  .rank-name {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 1.7rem;
    margin: 0;
  }
  .rank-up {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 1.3rem;
    color: var(--margin-red);
    margin: 14px 0 0;
  }
  .also.gain { color: var(--right); }

  /* ---- Rewards and farm ---- */
  .picks .pick { display: flex; align-items: center; gap: 14px; }
  .picks .art { flex: none; width: 72px; height: 72px; display: grid; place-items: center; }
  .picks .art svg { image-rendering: pixelated; }
  .picks .who { flex: 1; }
  .picks .rarity { display: block; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }

  .farm-scene {
    display: block;
    width: 100%;
    height: auto;
    margin: 16px 0 4px;
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    image-rendering: pixelated;
  }  .stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 16px; margin-top: 18px; }
  .stamps figure { margin: 0; text-align: center; }
  .stamps figcaption { font-size: 0.75rem; color: var(--ink-soft); margin-top: 2px; }

  .modes { display: grid; gap: 10px; }

  .text {
    border-radius: 5px;
    padding: 11px 18px;
    border: 1.5px solid var(--card-edge);
    background: transparent;
    color: var(--ink);
  }
  .text:hover { border-color: var(--ink); }
  .text:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .text.primary { font-weight: 700; background: var(--ink); border-color: var(--ink); color: var(--paper); }
  [hidden] { display: none !important; }

  .link {
    background: none;
    border: none;
    color: var(--ink-soft);
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link:hover { color: var(--ink); }

  /* ---- Quiz shell ---- */
  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .topbar .counter { color: var(--ink-soft); font-size: 0.9rem; }

  .track { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 18px; }
  .tick { width: 18px; height: 18px; border: 1px solid var(--card-edge); border-radius: 3px; }
  .tick.right { background: var(--right); border-color: var(--right); }
  .tick.wrong { background: var(--wrong); border-color: var(--wrong); }
  .tick.now { border-color: var(--ink); border-width: 2px; }

  .prompt {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: clamp(1.8rem, 6.5vw, 2.5rem);
    font-weight: 600;
    line-height: 1.2;
    margin: 0 0 22px;
  }

  .option { display: flex; align-items: center; gap: 12px; }
  .option .key { font-size: 0.8rem; color: var(--ink-soft); min-width: 1.1em; }
  .option.picked-right { border-color: var(--right); background: var(--right-bg); }
  .option.picked-wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .option.reveal { border-color: var(--right); border-style: dashed; }
  .option.speaking .word { text-decoration: underline; text-underline-offset: 4px; }

  .verdict { margin: 18px 0 0; min-height: 1.5em; }
  .verdict .also { color: var(--ink-soft); font-size: 0.95rem; display: block; }

  .level { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 6px; }
  .level .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--card-edge); }
  .level .dot.on { background: var(--right); border-color: var(--right); }

  .summary { margin: 18px 0 0; }
  .summary li { margin-bottom: 4px; }
  .summary .fr { color: var(--ink-soft); }

  .report { list-style: none; padding: 0; margin: 14px 0 0; }
  .report li {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--card-edge);
  }
  .report li:last-child { border-bottom: none; }
  .report .en { font-weight: 700; }
  .report .fr, .report .meta { display: block; color: var(--ink-soft); font-size: 0.85rem; }
  .report .dots { flex: none; padding-top: 4px; }
  .card + .card { margin-top: 14px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

  /* ---- Speaking mode ---- */
  .mic-row { display: flex; align-items: center; gap: 14px; }
  .mic {
    width: 74px; height: 74px; flex: none;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
  }
  .mic svg { width: 28px; height: 28px; }
  .mic:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .mic[disabled] { opacity: .4; cursor: default; }
  .mic.listening { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  @media (prefers-reduced-motion: no-preference) {
    .mic.listening { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--wrong-bg); }
      50% { box-shadow: 0 0 0 12px var(--wrong-bg); }
    }
  }
  .mic-label { color: var(--ink-soft); }

  .heard {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 1.4rem;
    margin: 20px 0 0;
    min-height: 1.6em;
    word-break: break-word;
  }
  .heard.ok { color: var(--right); }
  .heard.ko { color: var(--wrong); }

  .fallback { margin-top: 20px; border-top: 1px solid var(--card-edge); padding-top: 16px; }
  .fallback p { margin: 0 0 10px; color: var(--ink-soft); font-size: 0.95rem; }
  .fallback form { display: flex; gap: 8px; }
  .fallback input {
    flex: 1; font: inherit; color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--card-edge);
    border-radius: 5px;
    padding: 11px 13px;
  }
  .fallback input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

  .notice { margin-top: 14px; font-size: 0.9rem; color: var(--wrong); }

  /* ---- Dictation ---- */
  .spell { display: flex; gap: 8px; margin-top: 4px; }
  .spell input {
    flex: 1;
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 1.3rem;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--card-edge);
    border-radius: 5px;
    padding: 10px 13px;
    min-width: 0;
  }
  .spell input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .spell input:disabled { opacity: 0.7; }
  .diff {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 1.2rem;
    letter-spacing: 0.04em;
  }
  .diff .miss { color: var(--wrong); text-decoration: underline; text-underline-offset: 3px; }

  .score-line {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 2.4rem;
    margin: 0 0 8px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .choice, .text { transition: border-color .15s, background-color .15s; }
  }
</style>
</head>
<body>
<script src="words.js"></script>
<script src="farm.js"></script>

<main class="sheet">
  <h1 id="heading">My English</h1>
  <div id="screen"></div>
</main>

<script>
/* =====================================================================
   VOCABULARY — the words live in words.js, loaded just before this
   script. That file grows all year; this one rarely changes.
   See the header of words.js for how to add a word or a list.
   ===================================================================== */
let LESSONS = [];

function loadLessons() {
  // words.js declares VOCABULARY. A bare array is accepted too, in case
  // the file gets simplified one day.
  if (typeof VOCABULARY === "undefined") throw new Error("words.js n'est pas chargé");
  const lessons = Array.isArray(VOCABULARY) ? VOCABULARY : VOCABULARY.lessons;
  if (!Array.isArray(lessons) || !lessons.length) throw new Error("aucune liste dans words.js");
  return lessons;
}

// Longest round allowed. Beyond this the words are drawn at random,
// so "tous les mots" stays a reasonable length as the lists grow.
const ROUND_LENGTH = 15;

// ---- Helpers ----
const screen = document.getElementById("screen");

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function esc(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// Strips accents, punctuation and doubled spaces before comparing answers.
// Apostrophes are removed rather than turned into spaces, so a transcription
// like "dont run" still matches "don't run".
function normalise(text) {
  return text
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/['\u2019\u02bc]/g, "")
    .replace(/[^a-z ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function isAccepted(word, attempt) {
  const said = normalise(attempt);
  if (!said) return false;
  const targets = [...word.en, ...(word.heard || [])].map(normalise);
  return targets.some(t => said === t || said.includes(" " + t) || said.startsWith(t + " "));
}

/* =====================================================================
   PROGRESS STORAGE — the only place that knows where the data lives.

   The whole app goes through Store.load / Store.save / Store.merge and
   through the helpers below. To move the progress to a server later,
   rewrite those three functions to call the API and leave the rest of the
   file untouched. They are already asynchronous for that reason.

   Stored shape:
     {
       version: 2,
       points: 412,
       words: { "lessonId:Mot francais": { level, seen, ok, last } },
       days:  { "2026-09-10": { n: 12, goal: 15, stamp: 3, p: 54 } },
       today: { date: "2026-09-10", keys: ["greetings:Salut"] }
     }
   ===================================================================== */
const STORE_KEY = "anglais-progress-v1";
const MAX_LEVEL = 5;

/* Demonstration mode: index.html?demo=40 shows what the app looks like at
   rank 40, farm and all, without touching what the pupil has really done.
   Nothing is written to storage while it is on. */
const DEMO_RANK = Math.max(0, Math.min(FARM.RANK_COUNT,
  Number(new URLSearchParams(location.search).get("demo")) || 0));

// Days to wait before a word falls due again, by level. A word just learnt
// comes back tomorrow, a mastered one every fortnight: nothing is ever
// dropped for good.
const INTERVALS = [0, 1, 2, 4, 8, 15];

// The daily goal follows the words that fall due, but never asks for fewer
// than the floor, so that a quiet day is still a real session, nor more than
// the ceiling, so that a week away does not come back as an unbearable pile.
const GOAL_FLOOR = 10;
const GOAL_CEILING = 20;

function dayKey(date) {
  const day = date || new Date();
  return day.getFullYear() + "-" +
    String(day.getMonth() + 1).padStart(2, "0") + "-" +
    String(day.getDate()).padStart(2, "0");
}

function emptyProgress() {
  return { version: 2, points: 0, words: {}, days: {}, today: { date: dayKey(), keys: [] },
           farm: { owned: [], offer: null, pending: 0 } };
}

const Store = {
  async load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      return Store.adopt(raw ? JSON.parse(raw) : null);
    } catch (error) {
      return emptyProgress();
    }
  },

  async save(data) {
    if (DEMO_RANK) return false;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
      return true;
    } catch (error) {
      return false;
    }
  },

  // Accepts anything previously stored, including the version 1 shape which
  // only had `words`, and starts a fresh tally when the date has turned.
  adopt(data) {
    const fresh = emptyProgress();
    if (!data) return fresh;
    fresh.points = data.points || 0;
    fresh.words = data.words || {};
    fresh.days = data.days || {};
    if (data.farm) {
      fresh.farm.owned = data.farm.owned || [];
      fresh.farm.offer = data.farm.offer || null;
      fresh.farm.pending = data.farm.pending || 0;
    }
    if (data.today && data.today.date === dayKey()) fresh.today = data.today;
    return fresh;
  },

  // Needed the day the same pupil practises on two devices: for each word
  // the most recent record wins, and for each day the fuller tally wins.
  merge(local, remote) {
    const merged = Store.adopt(local);
    for (const [key, record] of Object.entries((remote && remote.words) || {})) {
      const mine = merged.words[key];
      if (!mine || (record.last || 0) > (mine.last || 0)) merged.words[key] = record;
    }
    for (const [key, day] of Object.entries((remote && remote.days) || {})) {
      const mine = merged.days[key];
      if (!mine || (day.n || 0) > (mine.n || 0)) merged.days[key] = day;
    }
    // The total is rebuilt from the days rather than added up, so that
    // syncing twice cannot inflate it.
    merged.points = Object.values(merged.days).reduce((sum, day) => sum + (day.p || 0), 0);
    const theirs = (remote && remote.farm) || { owned: [] };
    if ((theirs.owned || []).length > merged.farm.owned.length) merged.farm = theirs;
    return merged;
  }
};

let progress = emptyProgress();

// Every word gets a stable key. Renaming the French side of a word starts
// its progress over, which is the intended behaviour: it is a new word.
function keyLessons() {
  LESSONS.forEach(lesson => {
    lesson.words.forEach(word => { word.key = lesson.id + ":" + word.fr; });
  });
}

function recordOf(word) {
  return progress.words[word.key] || { level: 0, seen: 0, ok: 0, last: 0 };
}

function allWords() {
  return LESSONS.flatMap(lesson => lesson.words);
}

// ---- Spaced repetition ----
// Milliseconds until the word falls due again; negative once it is overdue.
function dueIn(word) {
  const record = recordOf(word);
  if (!record.last) return -Infinity;
  return record.last + INTERVALS[record.level] * 86400000 - Date.now();
}

function isDue(word) { return dueIn(word) <= 0; }

function dueWords(pool) {
  return pool.filter(isDue).sort((a, b) => dueIn(a) - dueIn(b));
}

// ---- The day's goal ----
function computeGoal() {
  const words = allWords();
  const due = dueWords(words).length;
  return Math.max(Math.min(GOAL_FLOOR, words.length), Math.min(due, GOAL_CEILING));
}

function today() {
  const key = dayKey();
  if (progress.today.date !== key) progress.today = { date: key, keys: [] };
  if (!progress.days[key]) progress.days[key] = { n: 0, goal: computeGoal(), stamp: null };
  return progress.days[key];
}

// A word counts once a day, whether it was right or wrong: the goal rewards
// the effort, so that no one avoids the hard words or the speaking mode.
function noteReview(word) {
  const day = today();
  const first = !progress.today.keys.includes(word.key);
  if (first) {
    progress.today.keys.push(word.key);
    day.n = progress.today.keys.length;
  }
  const completed = first && day.stamp === null && day.n >= day.goal;
  if (completed) day.stamp = stampFor(dayKey());
  return { first, completed };
}

/* ---- Points and ranks ----
   Points reward the effort first: a word counts simply for having been
   attempted. The full amount is given once per word per day, so replaying
   the same short list cannot inflate the total, while a second round still
   brings a little. The speaking mode pays more because it is the hardest
   and the one most likely to be avoided. */
const POINTS = { word: 2, correct: 1, speaking: 1, goal: 20, again: 1 };

// Ranks, rewards and the farm drawing live in farm.js: that logic has
// nothing to do with learning English and evolves on its own.
function rankOf(points) {
  return FARM.rankOf(points || 0);
}

function addPoints(amount) {
  const before = rankOf(progress.points).index;
  progress.points = (progress.points || 0) + amount;
  const after = rankOf(progress.points).index;
  // Several ranks can fall in one round; each owes a reward, so they queue.
  if (after > before) progress.farm.pending += after - before;
  const day = today();
  day.p = (day.p || 0) + amount;
}

// ---- Rewards ----
// The three items on offer are stored, not redrawn on the fly: reloading
// the page must not reshuffle a choice the pupil is thinking about.
function currentOffer() {
  const rank = rankOf(progress.points).index;
  if (!progress.farm.offer) {
    progress.farm.offer = { rank, ids: FARM.offerFor(rank, progress.farm.owned) };
    Store.save(progress);
  }
  return progress.farm.offer;
}

function chooseReward(id) {
  progress.farm.owned.push(id);
  progress.farm.offer = null;
  progress.farm.pending = Math.max(0, progress.farm.pending - 1);
  Store.save(progress);
}

function goalState() {
  const day = today();
  return { done: day.n, goal: day.goal, complete: day.stamp !== null, stamp: day.stamp };
}

// A success moves the word one level up, a mistake one level down rather
// than back to zero, so a slip does not wipe out a fortnight of work.
function recordResult(word, success) {
  const before = recordOf(word);
  const after = {
    level: success ? Math.min(MAX_LEVEL, before.level + 1) : Math.max(0, before.level - 1),
    seen: before.seen + 1,
    ok: before.ok + (success ? 1 : 0),
    last: Date.now()
  };
  progress.words[word.key] = after;

  const note = noteReview(word);
  let gained = note.first
    ? POINTS.word + (success ? POINTS.correct : 0) +
      (state.mode === "say" || state.mode === "spell" ? POINTS.speaking : 0)
    : (success ? POINTS.again : 0);
  if (note.completed) {
    gained += POINTS.goal;
    state.stampEarned = true;
  }
  addPoints(gained);
  state.roundPoints += gained;

  Store.save(progress);
  return { before, after, gained };
}

function masteredCount(pool) {
  return pool.filter(word => recordOf(word).level >= MAX_LEVEL).length;
}

// Progress of a whole list. The bar uses the sum of the levels rather than
// the count of finished words, so it moves from the very first round instead
// of sitting at zero until a word reaches the top.
function progressOf(pool) {
  const levels = pool.reduce((sum, word) => sum + recordOf(word).level, 0);
  return {
    ratio: pool.length ? levels / (pool.length * MAX_LEVEL) : 0,
    mastered: masteredCount(pool),
    started: pool.some(word => recordOf(word).seen > 0)
  };
}

// Weight for the targeted draw: an overdue word counts most, then a weak
// one, then one left aside for a while.
function weightOf(word) {
  const record = recordOf(word);
  const days = record.last ? (Date.now() - record.last) / 86400000 : 30;
  return (isDue(word) ? 10 : 0) + (MAX_LEVEL + 1 - record.level) * 2 + Math.min(6, days);
}

// Weighted draw without replacement.
function drawWords(pool, count) {
  const remaining = pool.slice();
  const picked = [];
  while (picked.length < count && remaining.length) {
    const weights = remaining.map(weightOf);
    let target = Math.random() * weights.reduce((sum, weight) => sum + weight, 0);
    let i = 0;
    while (i < weights.length - 1 && target > weights[i]) { target -= weights[i]; i++; }
    picked.push(remaining.splice(i, 1)[0]);
  }
  return shuffle(picked);
}

// ---- Stamps ----
// One stamp per day the goal is met. The design is picked from the date, so
// it never changes once earned, and the collection stays varied.
const STAMPS = [
  { top: "VERY", bottom: "GOOD" },
  { top: "WELL", bottom: "DONE" },
  { top: "TOP", bottom: "MARKS" },
  { top: "NICE", bottom: "WORK" },
  { top: "KEEP", bottom: "GOING" },
  { top: "GOOD", bottom: "JOB" }
];

function stampFor(key) {
  let hash = 7;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) % 9973;
  return hash % STAMPS.length;
}

function stampSvg(index, size) {
  const stamp = STAMPS[index % STAMPS.length];
  const tilt = ((index * 47) % 19) - 9;
  return '<svg class="stamp" viewBox="0 0 100 100" width="' + size + '" height="' + size + '" ' +
      'style="transform:rotate(' + tilt + 'deg)" role="img" aria-label="Tampon ' +
      stamp.top + ' ' + stamp.bottom + '">' +
      '<circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3.5"/>' +
      '<circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="1.5"/>' +
      '<path d="M50 14 l2.6 5.3 5.8.8 -4.2 4.1 1 5.8 -5.2-2.7 -5.2 2.7 1-5.8 -4.2-4.1 5.8-.8z" ' +
        'fill="currentColor"/>' +
      '<text x="50" y="52" text-anchor="middle" font-size="16" font-weight="700" ' +
        'letter-spacing="1" fill="currentColor">' + stamp.top + '</text>' +
      '<text x="50" y="70" text-anchor="middle" font-size="16" font-weight="700" ' +
        'letter-spacing="1" fill="currentColor">' + stamp.bottom + '</text>' +
    '</svg>';
}

function earnedStamps() {
  return Object.entries(progress.days)
    .filter(([, day]) => day.stamp !== null && day.stamp !== undefined)
    .sort((a, b) => (a[0] < b[0] ? 1 : -1));
}

function levelDots(level) {
  let dots = "";
  for (let i = 0; i < MAX_LEVEL; i++) dots += '<span class="dot' + (i < level ? " on" : "") + '"></span>';
  return '<span class="level" role="img" aria-label="Niveau ' + level + ' sur ' + MAX_LEVEL + '">' +
    dots + '</span>';
}

function levelNote(change) {
  const gained = change.gained
    ? '<span class="also gain">+' + change.gained + ' point' + (change.gained > 1 ? 's' : '') + '</span>'
    : '';
  const text =
    change.after.level === MAX_LEVEL ? "Mot acquis." :
    change.after.level > change.before.level ? "Ce mot monte d'un niveau." :
    change.after.level < change.before.level ? "Ce mot redescend d'un niveau." :
    "Niveau du mot :";
  return '<span class="also">' + text + levelDots(change.after.level) + '</span>' + gained;
}

// ---- Speech synthesis ----
const canSpeak = "speechSynthesis" in window;
let englishVoice = null;

function pickVoice() {
  const voices = window.speechSynthesis.getVoices();
  englishVoice =
    voices.find(v => v.lang === "en-GB") ||
    voices.find(v => v.lang === "en-US") ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) || null;
}
if (canSpeak) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text, button) {
  if (!canSpeak) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  if (englishVoice) utterance.voice = englishVoice;
  utterance.lang = englishVoice ? englishVoice.lang : "en-GB";
  utterance.rate = 0.85;
  if (button) {
    button.classList.add("speaking");
    const clear = () => button.classList.remove("speaking");
    utterance.onend = clear;
    utterance.onerror = clear;
  }
  window.speechSynthesis.speak(utterance);
}

// ---- Speech recognition ----
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let micGranted = false;

if (Recognition) {
  recognition = new Recognition();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.maxAlternatives = 5;
  recognition.continuous = false;
}

function embedded() {
  try { return window.self !== window.top; } catch (error) { return true; }
}

// Speech recognition alone does not always raise the browser prompt, so the
// microphone is requested explicitly and the exact blocker is reported.
async function ensureMicPermission() {
  if (micGranted) return true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(track => track.stop());
    micGranted = true;
    return true;
  } catch (error) {
    if (error.name === "NotAllowedError" || error.name === "SecurityError") {
      say.notice(embedded()
        ? "Le micro est bloqué parce que la page est dans un cadre. Ouvre-la dans son propre onglet, ou dicte la réponse ci-dessous."
        : "Le micro est refusé. Autorise-le via l'icône à gauche de l'adresse, puis recharge la page.");
    } else if (error.name === "NotFoundError") {
      say.notice("Aucun micro n'a été trouvé sur cet appareil.");
    } else if (error.name === "NotReadableError") {
      say.notice("Le micro est déjà utilisé par une autre application.");
    } else {
      say.notice("Le micro n'a pas pu démarrer.");
    }
    return false;
  }
}

function poolFor(lessonId) {
  if (lessonId === "*") return allWords();
  // The daily session: the words that have fallen due, oldest first. Once
  // everything is up to date it falls back to the whole set, so wanting to
  // revise more is never refused.
  if (lessonId === "!due") return allWords();
  const lesson = LESSONS.find(l => l.id === lessonId);
  return lesson ? lesson.words : [];
}

function lessonTitle(lessonId) {
  if (lessonId === "*") return "Tous les mots";
  if (lessonId === "!due") return "Révision du jour";
  const lesson = LESSONS.find(l => l.id === lessonId);
  return lesson ? lesson.title : "";
}

// ---- Report ----
// One section per list, every word with its level. Words keep their lesson
// order rather than being ranked worst first: this is a picture of the work
// done, not a list of failures.
function relativeDate(timestamp) {
  if (!timestamp) return "jamais révisé";
  const days = Math.floor((Date.now() - timestamp) / 86400000);
  if (days <= 0) return "aujourd'hui";
  if (days === 1) return "hier";
  if (days < 7) return "il y a " + days + " jours";
  if (days < 14) return "la semaine dernière";
  if (days < 60) return "il y a " + Math.floor(days / 7) + " semaines";
  return "il y a " + Math.floor(days / 30) + " mois";
}

function renderReport() {
  const sections = LESSONS.map(lesson => {

    const rows = lesson.words.map(word => {

        : "jamais révisé";

          '<span class="en">' + esc(word.en[0]) + '</span>' +
          '<span class="fr">' + esc(word.fr) + '</span>' +

    }).join("");

    return '<section class="card">' +
        '<p class="label" style="margin-bottom:0"><b>' + esc(lesson.title) + '</b></p>' +
        '<span class="bar"><span style="width:' + Math.round(stats.ratio * 100) + '%"></span></span>' +
        '<span class="done">' + stats.mastered + ' mot' + (stats.mastered > 1 ? "s" : "") +
          ' acquis sur ' + lesson.words.length + '</span>' +

      '</section>';
  }).join("");

  screen.innerHTML =
    '<section class="card">' +
      '<button class="link" id="back">← Retour</button>' +
      '<p class="label" style="margin:14px 0 0">Chaque mot monte d\'un niveau par bonne réponse. ' +
        'Cinq points remplis, le mot est acquis.</p>' +
    '</section>' + rankBanner() + sections;

  document.getElementById("back").addEventListener("click", renderMenu);
  document.getElementById("back").focus();
  window.scrollTo(0, 0);

// ---- Round setup ----
function startRound(lessonId) {
  state.lesson = lessonId;
  state.stampEarned = false;
  state.roundPoints = 0;
  state.rankBefore = rankOf(progress.points).index;
  const pool = poolFor(lessonId);
  // The daily session is exactly as long as what is left of the goal, so
  // finishing it finishes the day. Free practice keeps the usual length.
  const goal = goalState();
  const length = lessonId === "!due" && !goal.complete
    ? Math.max(5, Math.min(GOAL_CEILING, goal.goal - goal.done))
    : ROUND_LENGTH;

  // The daily session takes the most urgent words first and, when fewer are
  // due than the goal asks for, tops up with those closest to falling due.
  // Without that top-up a quiet day could not reach the floor, and the
  // stamp would be out of reach through no fault of the pupil.
  // Free practice keeps the weighted draw, which favours overdue, weak and
  // long-unseen words without always serving the same ones.
  const picked = lessonId === "!due"
    ? shuffle(pool.slice().sort((a, b) => dueIn(a) - dueIn(b)).slice(0, length))
    : drawWords(pool, length);
  state.round = picked.map(word => {
    if (state.mode === "mcq") return buildForward(word, pool);
    if (state.mode === "mcqfr") return buildReverse(word, pool);
    return { word, prompt: word.fr };
  });
  state.index = 0;
  state.score = 0;
  renderShell();
  showQuestion();
}

// French prompt, English answers. Distractors come from the same pool and are
// never a synonym of the current word.
function buildForward(word, pool) {
  const answer = shuffle(word.en)[0];
  const banned = new Set([...word.en, ...(word.avoid || [])]);
  let others = pool.flatMap(w => w.en).filter(a => !banned.has(a));
  // A very short list would not offer enough wrong answers on its own.
  if (others.length < 3) {
    others = LESSONS.flatMap(l => l.words).flatMap(w => w.en).filter(a => !banned.has(a));
  }
  const distractors = shuffle([...new Set(others)]).slice(0, 3);
  return { word, prompt: word.fr, answer, options: shuffle([answer, ...distractors]) };
}

// English prompt, French answers. A word whose `avoid` list mentions the
// prompt would also be a correct translation, so it is left out.
function buildReverse(word, pool) {
  const prompt = shuffle(word.en)[0];
  const usable = candidates => candidates.filter(other =>
    other.fr !== word.fr &&
    !(other.avoid || []).includes(prompt) &&
    !other.en.includes(prompt)
  );
  let others = usable(pool);
  if (others.length < 3) others = usable(LESSONS.flatMap(l => l.words));
  const distractors = shuffle(others).slice(0, 3).map(other => other.fr);
  return { word, prompt, answer: word.fr, options: shuffle([word.fr, ...distractors]) };
}

}

function showQuestion() {
  state.locked = false;
  state.attempts = 0;
  markTrack(null);
  document.getElementById("counter").textContent =
    lessonTitle(state.lesson) + " · " + (state.index + 1) + "/" + state.round.length;
  document.getElementById("prompt").textContent = state.round[state.index].prompt;
  if (state.mode === "say") say.render();
  else if (state.mode === "spell") spell.render();
  else mcq.render();
}

function nextLabel() {
  return state.index === state.round.length - 1 ? "Voir le score" : "Mot suivant";
}

function goNext() {
  if (state.index === state.round.length - 1) showScore();
  else { state.index++; showQuestion(); }
}

function synonymNote(word, shown) {
  const others = word.en.filter(answer => answer !== shown);
  return others.length
    ? '<span class="also">On accepte aussi : ' + esc(others.join(", ")) + '.</span>'
    : "";
}

// ---- Modes 1 and 2: multiple choice, in either direction ----
const mcq = {
  reverse() { return state.mode === "mcqfr"; },

  render() {
    const question = state.round[state.index];
    document.getElementById("body").innerHTML =
      (mcq.reverse() ? '<div class="actions" style="margin-top:0;margin-bottom:18px">' +
        '<button class="text" id="hear">Réécouter la phrase</button></div>' : "") +
      '<div class="stack" id="options"></div>' +
      '<p class="verdict" id="verdict"></p>' +
      '<div class="actions"><button class="text primary" id="next" hidden></button></div>';

    const options = document.getElementById("options");
    question.options.forEach((option, i) => {
      const button = document.createElement("button");
      button.className = "choice option";
      button.type = "button";
      button.innerHTML = '<span class="key">' + (i + 1) + '</span><span class="word"></span>';
      button.querySelector(".word").textContent = option;
      button.addEventListener("click", () => mcq.choose(option, button));
      options.appendChild(button);
    });
    document.getElementById("next").addEventListener("click", goNext);

    if (mcq.reverse()) {
      // The prompt is English here, so it is spoken on arrival and on demand.
      document.getElementById("hear").addEventListener("click", () => speak(question.prompt));
      speak(question.prompt);
    }
  },

  choose(option, button) {
    const question = state.round[state.index];
    // Going French to English, the chosen answer is read aloud every time,
    // including once the question is settled, so pronunciations can be compared.
    if (!mcq.reverse()) speak(option, button);
    if (state.locked) return;
    state.locked = true;

    const success = option === question.answer;
    if (success) state.score++;
    const change = recordResult(question.word, success);
    button.classList.add(success ? "picked-right" : "picked-wrong");
    markTrack(success ? "right" : "wrong");

    if (!success) {
      for (const other of document.getElementById("options").children) {
        if (other.querySelector(".word").textContent === question.answer) {
          other.classList.add("reveal");
        }
      }
    }

    const verdict = document.getElementById("verdict");
    if (mcq.reverse()) {
      speak(question.prompt);
      const synonyms = question.word.en.filter(answer => answer !== question.prompt);
      verdict.innerHTML =
        (success ? "<b>Bravo.</b> " : "<b>Raté.</b> ") +
        esc(question.prompt) + " = " + esc(question.answer) + "." +
        (synonyms.length
          ? '<span class="also">Se dit aussi : ' + esc(synonyms.join(", ")) + '.</span>'
          : "") +
        levelNote(change);
    } else {
      verdict.innerHTML =
        (success ? "<b>Bravo.</b> " : "<b>Raté.</b> ") +
        esc(question.word.fr) + " = " + esc(question.answer) + "." +
        synonymNote(question.word, question.answer) +
        '<span class="also">Clique sur un mot pour l\'entendre à nouveau.</span>' +
        levelNote(change);
    }

    const next = document.getElementById("next");
    next.textContent = nextLabel();
    next.hidden = false;
    next.focus();
  }
};

// ---- Mode 2: say the answer ----
/* ---- Mode 4: hear it, write it ----
   Spelling is judged exactly: accents and case are ignored, letters are
   not. The `heard` variants used by the speaking mode are deliberately
   left out here, since "said" for sad is a microphone artefact, not an
   acceptable spelling. A wrong answer has to be copied out correctly
   before moving on, because writing the word once is what fixes it. */
const spell = {
  correctFor(word) { return word.en[0]; },

  matches(word, attempt) {
    const said = normalise(attempt);
    return word.en.some(answer => normalise(answer) === said);
  },

  // Marks, letter by letter, where the attempt parts from the answer.
  diff(answer, attempt) {
    const a = normalise(answer);
    const b = normalise(attempt);
    let out = "";
    for (let i = 0; i < answer.length; i++) {
      const same = b[i] === a[i];
      out += (same ? '<span>' : '<span class="miss">') + esc(answer[i]) + '</span>';
    }
    return '<span class="diff">' + out + '</span>';
  },

  render() {
    const word = state.round[state.index].word;
    document.getElementById("body").innerHTML =
      '<div class="actions" style="margin-top:0">' +
        '<button class="text" id="hear">Réécouter le mot</button>' +
      '</div>' +
      '<form id="spellForm" class="spell">' +
        '<input id="typed" type="text" lang="en" autocomplete="off" autocapitalize="none" ' +
               'autocorrect="off" spellcheck="false" placeholder="Écris le mot en anglais" ' +
               'aria-label="Écris le mot en anglais">' +
        '<button class="text primary" type="submit" id="check">Valider</button>' +
      '</form>' +
      '<p class="verdict" id="verdict"></p>' +
      '<div class="actions">' +
        '<button class="text primary" id="next" hidden></button>' +
        '<button class="text" id="skip">Voir la réponse</button>' +
      '</div>';

    const input = document.getElementById("typed");
    document.getElementById("hear").addEventListener("click", () => speak(spell.correctFor(word)));
    document.getElementById("skip").addEventListener("click", () => spell.settle(false, ""));
    document.getElementById("next").addEventListener("click", goNext);
    document.getElementById("spellForm").addEventListener("submit", event => {
      event.preventDefault();
      const attempt = input.value.trim();
      if (!attempt) return;
      if (state.locked) spell.checkCopy(attempt);
      else if (spell.matches(word, attempt)) spell.settle(true, attempt);
      else spell.settle(false, attempt);
    });

    input.focus();
    // The word is read on arrival: this mode is a dictation.
    speak(spell.correctFor(word));
  },

  settle(success, attempt) {
    if (state.locked) return;
    state.locked = true;
    const word = state.round[state.index].word;
    const answer = spell.correctFor(word);
    const change = recordResult(word, success);
    const verdict = document.getElementById("verdict");
    const input = document.getElementById("typed");

    if (success) {
      verdict.innerHTML = "<b>Sans faute.</b> " + esc(word.fr) + " = " + esc(attempt) + "." +
        synonymNote(word, attempt) + levelNote(change);
      input.disabled = true;
      document.getElementById("check").disabled = true;
      document.getElementById("skip").hidden = true;
      spell.showNext();
    } else {
      verdict.innerHTML =
        (attempt ? "<b>Pas tout à fait.</b> Tu as écrit " + esc(attempt) + "." : "<b>La réponse :</b>") +
        '<span class="also">Le mot s\'écrit ' + spell.diff(answer, attempt || "") + '.</span>' +
        levelNote(change);
      document.getElementById("skip").hidden = true;
      // Copying it out correctly is what unlocks the next word.
      input.value = "";
      input.placeholder = "Recopie : " + answer;
      input.focus();
      document.getElementById("check").textContent = "Recopier";
      const pass = document.createElement("button");
      pass.className = "link";
      pass.type = "button";
      pass.id = "pass";
      pass.textContent = "passer";
      pass.addEventListener("click", spell.showNext);
      document.querySelector(".actions").appendChild(pass);
    }
    markTrack(success ? "right" : "wrong");
  },

  checkCopy(attempt) {
    const word = state.round[state.index].word;
    if (spell.matches(word, attempt)) {
      document.getElementById("typed").disabled = true;
      document.getElementById("check").disabled = true;
      const pass = document.getElementById("pass");
      if (pass) pass.remove();
      spell.showNext();
    } else {
      document.getElementById("typed").value = "";
      document.getElementById("typed").focus();
    }
  },

  showNext() {
    const pass = document.getElementById("pass");
    if (pass) pass.remove();
    const next = document.getElementById("next");
    next.textContent = nextLabel();
    next.hidden = false;
    next.focus();
  }
};

const say = {
  render() {
    document.getElementById("body").innerHTML =
      '<div class="mic-row">' +
        '<button class="mic" id="mic" type="button" aria-label="Parler">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
               'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<rect x="9" y="2" width="6" height="12" rx="3"></rect>' +
            '<path d="M5 11a7 7 0 0 0 14 0"></path>' +
            '<line x1="12" y1="18" x2="12" y2="22"></line>' +
          '</svg>' +
        '</button>' +
        '<span class="mic-label" id="micLabel"></span>' +
      '</div>' +
      '<p class="heard" id="heard" aria-live="polite"></p>' +
      '<p class="verdict" id="verdict"></p>' +
      '<div class="actions">' +
        '<button class="text primary" id="next" hidden></button>' +
        '<button class="text" id="model">Écouter le modèle</button>' +
        '<button class="text" id="skip">Donner la réponse</button>' +
      '</div>' +
      '<div class="fallback" id="fallback" hidden>' +
        '<p id="fallbackNote"></p>' +
        '<form id="typeForm">' +
          '<input id="typed" type="text" lang="en" autocomplete="off" autocapitalize="none" ' +
                 'autocorrect="off" spellcheck="false" placeholder="Ta réponse en anglais" ' +
                 'aria-label="Ta réponse en anglais">' +
          '<button class="text" type="submit">Valider</button>' +
        '</form>' +
        '<p id="dictate" hidden>Appuie sur le champ, puis sur le micro de ton clavier et prononce ' +
          'le mot. Pense à mettre le clavier en anglais, sinon il écrira du français.</p>' +
      '</div>' +
      '<p class="notice" id="notice" hidden></p>';

    const mic = document.getElementById("mic");
    mic.disabled = !recognition;
    document.getElementById("micLabel").textContent = recognition
      ? "Appuie et prononce la réponse."
      : "Ce navigateur ne reconnaît pas la parole.";

    mic.addEventListener("click", say.listen);
    document.getElementById("model").addEventListener("click", () => {
      if (listening) recognition.stop();
      speak(state.round[state.index].word.en[0]);
    });
    document.getElementById("skip").addEventListener("click", () => {
      if (listening) recognition.stop();
      say.settle(false);
    });
    document.getElementById("next").addEventListener("click", goNext);
    document.getElementById("typeForm").addEventListener("submit", event => {
      event.preventDefault();
      if (state.locked) return;
      const value = document.getElementById("typed").value.trim();
      if (value) say.judge([value]);
    });

    // The on-screen keyboard has its own dictation button, which works even
    // where the browser microphone is blocked, so phones get it straight away.
    if (!recognition) {
      say.fallback("Ce navigateur ne reconnaît pas la parole. Écris la réponse ici.");
    } else if (matchMedia("(pointer: coarse)").matches) {
      say.fallback("Dicte ou écris la réponse ici.");
    }
  },

  fallback(text) {
    document.getElementById("fallbackNote").textContent = text;
    document.getElementById("fallback").hidden = false;
    if (matchMedia("(pointer: coarse)").matches) {
      document.getElementById("dictate").hidden = false;
    }
  },

  notice(text) {
    const notice = document.getElementById("notice");
    if (!notice) return;
    notice.textContent = text;
    notice.hidden = false;
    say.fallback("Dicte ou écris la réponse ici.");
  },

  async listen() {
    if (!recognition || state.locked) return;
    if (listening) { recognition.stop(); return; }
    if (canSpeak) window.speechSynthesis.cancel();

    const label = document.getElementById("micLabel");
    label.textContent = "Autorisation du micro…";
    const allowed = await ensureMicPermission();
    if (!allowed) { label.textContent = "Micro indisponible."; return; }

    try {
      recognition.start();
    } catch (error) {
      // start() throws if the previous session has not fully ended yet.
      label.textContent = "Attends une seconde, puis réessaie.";
    }
  },

  judge(transcripts) {
    const word = state.round[state.index].word;
    const heard = document.getElementById("heard");
    heard.textContent = "« " + transcripts[0].trim() + " »";
    if (transcripts.some(t => isAccepted(word, t))) {
      say.settle(true);
    } else {
      state.attempts++;
      heard.className = "heard ko";
      document.getElementById("verdict").textContent = state.attempts >= 2
        ? "Toujours pas. Écoute le modèle, puis réessaie."
        : "Ce n'est pas ça. Réessaie.";
    }
  },

  settle(success) {
    state.locked = true;
    const word = state.round[state.index].word;
    const heard = document.getElementById("heard");
    const verdict = document.getElementById("verdict");
    const change = recordResult(word, success);

    if (success) {
      state.score++;
      heard.className = "heard ok";
      verdict.innerHTML = "<b>Bien prononcé.</b>" + synonymNote(word, word.en[0]) + levelNote(change);
    } else {
      heard.className = "heard ko";
      verdict.innerHTML = "<b>La réponse était :</b> " + esc(word.en[0]) + "." +
        synonymNote(word, word.en[0]) + levelNote(change);
      speak(word.en[0]);
    }

    markTrack(success ? "right" : "wrong");
    document.getElementById("mic").disabled = true;
    document.getElementById("skip").hidden = true;
    document.getElementById("micLabel").textContent = success ? "Bravo." : "";
    const next = document.getElementById("next");
    next.textContent = nextLabel();
    next.hidden = false;
    next.focus();
  }
};

if (recognition) {
  recognition.onstart = () => {
    listening = true;
    const mic = document.getElementById("mic");
    if (mic) mic.classList.add("listening");
    const label = document.getElementById("micLabel");
    if (label) label.textContent = "J'écoute…";
    const heard = document.getElementById("heard");
    if (heard) { heard.textContent = ""; heard.className = "heard"; }
  };

  recognition.onresult = event => {
    const result = event.results[event.results.length - 1];
    const transcripts = [];
    for (let i = 0; i < result.length; i++) transcripts.push(result[i].transcript);
    const heard = document.getElementById("heard");
    if (heard) heard.textContent = "« " + transcripts[0].trim() + " »";
    if (result.isFinal) say.judge(transcripts);
  };

  recognition.onerror = event => {
    stopListening();
    const label = document.getElementById("micLabel");
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      say.notice(embedded()
        ? "Le micro est bloqué parce que la page est dans un cadre. Ouvre-la dans son propre onglet, ou dicte la réponse ci-dessous."
        : "Le micro est bloqué. Autorise-le dans le navigateur, puis recharge la page.");
    } else if (event.error === "network") {
      say.notice("La reconnaissance vocale a besoin d'une connexion internet.");
    } else if (label) {
      label.textContent = event.error === "no-speech" ? "Je n'ai rien entendu. Réessaie." : "Réessaie.";
    }
  };

  recognition.onend = stopListening;
}

function stopListening() {
  listening = false;
  const mic = document.getElementById("mic");
  if (mic) mic.classList.remove("listening");
  const label = document.getElementById("micLabel");
  if (label && !state.locked && state.mode === "say") label.textContent = "Appuie et prononce la réponse.";
}

// ---- Score ----
function showScore() {
  const total = state.round.length;
  const comment =
    state.score === total ? "Sans faute." :
    state.score >= total - 2 ? "Presque parfait." :
    state.score >= total / 2 ? "C'est en bonne voie." :
    "Réécoute les mots et recommence.";

  // The words that came up in this round and are still weak: what to revise
  // next, rather than a bare score.
  const weak = state.round
    .map(question => question.word)
    .filter(word => recordOf(word).level < 3)
    .sort((a, b) => recordOf(a).level - recordOf(b).level)
    .slice(0, 5);

  const weakList = weak.length
    ? '<p class="label" style="margin-top:24px">À retravailler</p>' +
      '<ul class="summary">' + weak.map(word =>
        '<li>' + esc(word.en[0]) + ' <span class="fr">— ' + esc(word.fr) + '</span> ' +
        levelDots(recordOf(word).level) + '</li>'
      ).join("") + '</ul>'
    : '<p class="label" style="margin-top:24px">Rien à retravailler dans cette série.</p>';

  const rank = rankOf(progress.points);
  const rankUp = rank.index > state.rankBefore
    ? '<p class="rank-up">Rang ' + rank.index + ' — ' + esc(rank.name) + '</p>'
    : '';

  const goal = goalState();
  const stamp = state.stampEarned
    ? '<div class="row" style="display:flex;align-items:center;gap:16px;margin-top:20px">' +
        stampSvg(goal.stamp, 88) +
        '<span><b>Objectif du jour atteint.</b>' +
        '<span class="done">Un tampon de plus au carnet.</span></span>' +
      '</div>'
    : '';

  screen.innerHTML =
    '<section class="card">' +
      '<p class="score-line">' + state.score + " / " + total + '</p>' +
      '<p>' + comment + ' <b>+' + state.roundPoints + ' points</b></p>' +
      rankUp +
      stamp +
      weakList +
      '<div class="actions">' +
        (progress.farm.pending > 0
          ? '<button class="text primary" id="claim">Choisir ma récompense</button>'
          : '<button class="text primary" id="again">Recommencer</button>') +
        '<button class="text" id="menu">Changer de liste</button>' +
      '</div>' +
    '</section>';
  if (progress.farm.pending > 0) {
    document.getElementById("claim").addEventListener("click", renderReward);
  } else {
    document.getElementById("again").addEventListener("click", () => startRound(state.lesson));
  }
  document.getElementById("menu").addEventListener("click", renderMenu);
  const first = document.getElementById("claim") || document.getElementById("again");
  if (first) first.focus();
}

// Keys 1 to 4 answer in both multiple-choice modes.
document.addEventListener("keydown", event => {
  if (state.mode === "say" || state.mode === "spell") return;
  if (event.key >= "1" && event.key <= "4") {
    const options = document.getElementById("options");
    const button = options && options.children[Number(event.key) - 1];
    if (button) button.click();
  }
});

/* Builds a believable state at a given rank: the points that rank needs, a
   farm grown by making a choice at every rank along the way, word levels
   spread the way they would be after that much practice, and a run of past
   days in the stamp book. */
function demoProgress(rank) {
  const fake = emptyProgress();
  fake.points = FARM.THRESHOLDS[rank - 1] + 10;

  for (let step = 1; step <= rank; step++) {
    const offer = FARM.offerFor(step, fake.farm.owned);
    fake.farm.owned.push(offer[Math.floor(Math.random() * offer.length)]);
  }

  // The further along, the more words have been carried up to the top.
  const share = Math.min(0.9, rank / 60);
  allWords().forEach(word => {
    const level = Math.random() < share
      ? MAX_LEVEL - Math.floor(Math.random() * 2)
      : Math.floor(Math.random() * 4);
    const seen = level + 1 + Math.floor(Math.random() * 6);
    fake.words[word.key] = {
      level,
      seen,
      ok: Math.max(level, seen - 1 - Math.floor(Math.random() * 3)),
      last: Date.now() - Math.floor(Math.random() * 12) * 86400000
    };
  });

  // One stamped day per two ranks, running back from today.
  const days = Math.min(60, Math.ceil(rank / 2));
  for (let back = 0; back < days; back++) {
    const date = new Date();
    date.setDate(date.getDate() - back);
    fake.days[dayKey(date)] = { n: 20, goal: 20, stamp: stampFor(dayKey(date)), p: 60 };
  }
  fake.today = { date: dayKey(), keys: [] };
  fake.days[dayKey()].n = 0;
  fake.days[dayKey()].stamp = null;
  return fake;
}

// Start-up: the word list comes first, then the saved progress, then the
// menu. Both loads are awaited so that a network-backed Store or a remote
// word list would behave the same way.
(async function init() {
  try {
    LESSONS = loadLessons();
  } catch (error) {
    screen.innerHTML =
      '<section class="card">' +
        '<p><b>La liste de mots n\'a pas pu être chargée.</b></p>' +
        '<p class="label">Vérifie que le fichier <b>words.js</b> se trouve bien à côté de ' +
          'index.html, et qu\'il ne contient pas d\'erreur de syntaxe : une virgule oubliée ' +
          'ou une accolade en trop suffit. Le détail exact apparaît dans la console du navigateur.</p>' +
        '<p class="label">Détail technique : ' + esc(String(error && error.message)) + '</p>' +
      '</section>';
    return;
  }
  keyLessons();
  progress = DEMO_RANK ? demoProgress(DEMO_RANK) : await Store.load();
  renderMenu();
})();
</script>
</body>
