<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ears sit behind the head, big and round so they still read at 16px. -->
  <g fill="#2b2f36">
    <circle cx="13" cy="15" r="10"/>
    <circle cx="51" cy="15" r="10"/>
  </g>
  <g fill="#f4a6b8">
    <circle cx="13" cy="15" r="4.5"/>
    <circle cx="51" cy="15" r="4.5"/>
  </g>
  <ellipse cx="32" cy="36" rx="27" ry="24" fill="#ffffff" stroke="#2b2f36" stroke-width="3"/>
  <!-- Tilted eye patches give the soft, sleepy panda look. -->
  <g fill="#2b2f36">
    <ellipse cx="21" cy="34" rx="7.5" ry="9.5" transform="rotate(30 21 34)"/>
    <ellipse cx="43" cy="34" rx="7.5" ry="9.5" transform="rotate(-30 43 34)"/>
  </g>
  <g fill="#ffffff">
    <circle cx="22" cy="33" r="3.6"/>
    <circle cx="42" cy="33" r="3.6"/>
  </g>
  <g fill="#2b2f36">
    <circle cx="22.6" cy="33.6" r="2"/>
    <circle cx="41.4" cy="33.6" r="2"/>
  </g>
  <g fill="#ff8fa8" opacity="0.75">
    <ellipse cx="14" cy="46" rx="4.5" ry="3"/>
    <ellipse cx="50" cy="46" rx="4.5" ry="3"/>
  </g>
  <ellipse cx="32" cy="43" rx="4" ry="2.8" fill="#2b2f36"/>
  <path d="M28 48q2 2.5 4 0q2 2.5 4 0" fill="none" stroke="#2b2f36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
